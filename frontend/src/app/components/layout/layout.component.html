<div class="app-shell">
  <header class="app-header">
    <div class="brand-wrap">
      <img class="brand-logo" [src]="tenantLogo" [alt]="tenantName + ' logo'" />
      <div class="brand">{{ tenantName }}</div>
      <div class="card-art" aria-hidden="true">
        <div class="card card-back" [style.background]="activeTenant?.cardArt?.backGradient ?? null"></div>
        <div class="card card-front" [style.background]="activeTenant?.cardArt?.frontGradient ?? null">
          <span class="chip"></span>
          <span class="card-dots"></span>
        </div>
      </div>
    </div>
    <nav class="links">
      <a [routerLink]="['/']" [queryParams]="{ company: companyCode ?? undefined }">Home</a>
      <a [routerLink]="['/register']" [queryParams]="{ company: companyCode ?? undefined }" *ngIf="!isAuthenticated">Register</a>
      <a [routerLink]="['/login']" [queryParams]="{ company: companyCode ?? undefined }" *ngIf="!isAuthenticated">Login</a>
      <a [routerLink]="['/dashboard']" [queryParams]="{ company: companyCode ?? undefined }" *ngIf="isAuthenticated">Dashboard</a>
      <button type="button" (click)="logout()" *ngIf="isAuthenticated">Logout</button>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <div class="footer-title">Partner Contact & Billing</div>
    <div class="footer-grid">
      <article class="partner-card" *ngFor="let partner of footerPartners">
        <h4>{{ partner.name }}</h4>
        <img class="partner-image" [src]="partner.image" [alt]="partner.name + ' card preview'" />
        <p><strong>Mobile:</strong> {{ partner.mobileNumber }}</p>
        <p><strong>Address:</strong> {{ partner.contactAddress }}</p>
        <p><strong>Terms:</strong> {{ partner.termsAndConditions }}</p>
      </article>
    </div>
  </footer>
</div>
